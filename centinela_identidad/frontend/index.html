<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centinela</title>
<script src="js/session-bridge.js"></script>
<style>
  body { margin: 0; background: #0D1C19; }
</style>
</head>
<body>
<script>
  // Si ya hay sesión activa, ir directo al dashboard.
  // Si no, mostrar la landing con animación.
  const token = localStorage.getItem('token');
  if (token) {
    location.replace('dashboard.html');
  } else {
    location.replace('landing-scroll.html');
  }
</script>
</body>
</html>
