<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Calibración facial — Centinela</title>
<style>body{background:#0A1513;color:#d0ece8;font-family:'Segoe UI',sans-serif;margin:0;padding:16px;max-width:760px;margin:auto}
canvas{width:100%;background:#000;border-radius:12px}button,input{padding:9px 14px;border-radius:9px;border:1px solid #1E3330;background:#152321;color:#d0ece8;margin:4px 0}
button.p{background:#0DF2CC;color:#0D1C19;font-weight:700;border:none;cursor:pointer}pre{background:#0D1C19;padding:10px;border-radius:8px;font-size:12px}</style></head>
<body><h2>Calibración del umbral facial</h2>
<p>Captura ≥ 8 cuadros de ≥ 3 personas (cambia un poco pose y luz). Solo se guardan vectores numéricos en un archivo que tú descargas; nada se envía al servidor.
Después: <code>python tools/calibrar_umbral.py capturas.json</code></p>
<canvas id="cam"></canvas><br>
<button class="p" id="ini">▶ Iniciar cámara</button>
<input id="nom" placeholder="Nombre de la persona (ej. Ana)"> <button class="p" id="cap">Capturar 8 cuadros</button>
<button id="desc">⬇ Descargar capturas.json</button><pre id="log">Esperando…</pre>
<script src="js/biometria-core.js"></script>
<script>
const B = CentinelaBio, $ = (i) => document.getElementById(i), datos = {}; let motor;
const log = (t) => { $('log').textContent = t; };
$('ini').onclick = async () => { motor = new B.Motor($('cam')); try { await motor.iniciar(log); log('Cámara lista.'); } catch (e) { log(e.message); } };
$('cap').onclick = async () => {
  const n = $('nom').value.trim(); if (!n || !motor) return log('Pon un nombre e inicia la cámara.');
  datos[n] = datos[n] || [];
  for (let i = 0; i < 8; i++) {
    log(`${n}: cuadro ${i + 1}/8 — mueve un poco la cabeza`); await motor.rostroEstable(300, null, 8000);
    const d = await motor.descriptor(); if (d) datos[n].push(d); await new Promise(r => setTimeout(r, 700));
  }
  log(Object.entries(datos).map(([k, v]) => `${k}: ${v.length} capturas`).join('\n'));
};
$('desc').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ personas: datos })], { type: 'application/json' })); a.download = 'capturas.json'; a.click(); };
</script></body></html>
