<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centinela — Iniciar sesión</title>
    <script src="js/session-bridge.js"></script>
    <script src="js/ui-preferences.js"></script>
    <!-- Forzar dark siempre en auth pages, sin importar el toggle global -->
    <script>document.documentElement.className = 'dark';</script>
    <link rel="stylesheet" href="css/ui-shell.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

    /* ── Fondo verde oscuro con degradado radial ─────────────── */
    body {
        min-height: 100vh;
        background: radial-gradient(circle at 50% 40%, #123330 0%, #0D1C19 70%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        padding-top: 3rem;
        position: relative;
        overflow: hidden;
    }

    /* Brillos decorativos de fondo */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse 65% 55% at 15% 80%, rgba(13,242,204,0.08) 0%, transparent 58%),
            radial-gradient(ellipse 55% 45% at 85% 12%, rgba(13,242,204,0.06) 0%, transparent 52%);
        pointer-events: none;
        z-index: 0;
    }

    /* ── Privacy bar ─────────────────────────────────────────── */
    .privacy-bar {
        position: fixed;
        top: 0; left: 0; right: 0;
        background: rgba(10,21,18,0.95);
        border-bottom: 1px solid #1E3330;
        backdrop-filter: blur(8px);
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.72rem;
        color: #6B9E96;
        z-index: 50;
    }
    .privacy-bar .material-icons-round { font-size: 14px; color: #0DF2CC; }
    .privacy-bar a { color: #0DF2CC; text-decoration: none; font-weight: 600; white-space: nowrap; }
    .privacy-bar a:hover { text-decoration: underline; }
    .privacy-bar span { flex: 1; }

    /* ── Card principal ──────────────────────────────────────── */
    .auth-card {
        position: relative;
        z-index: 1;
        background: rgba(18,38,34,0.85);
        border: 1px solid rgba(30,51,48,0.9);
        border-radius: 1.75rem;
        padding: 2.75rem 2.25rem 2.25rem;
        width: 100%;
        max-width: 440px;
        box-shadow:
            0 40px 100px rgba(0,0,0,0.55),
            0 0 0 1px rgba(13,242,204,0.05),
            inset 0 1px 0 rgba(255,255,255,0.03);
        backdrop-filter: blur(12px);
        animation: fadeUp 0.45s cubic-bezier(.22,.68,0,1.2) forwards;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(24px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Logo ────────────────────────────────────────────────── */
    .auth-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 2.25rem;
        text-align: center;
    }

    .auth-logo-img {
        width: 150px;
        height: 150px;
        object-fit: contain;
        filter: drop-shadow(0 0 28px rgba(13,242,204,0.45));
        transition: transform 0.28s cubic-bezier(.22,.68,0,1.2), filter 0.28s ease;
        cursor: default;
    }
    .auth-logo-img:hover {
        transform: scale(1.07);
        filter: drop-shadow(0 0 40px rgba(13,242,204,0.65));
    }

    /* Fallback si logo.png no carga: badge con inicial */
    .auth-logo-mark {
        width: 88px; height: 88px; border-radius: 24px;
        background: rgba(13,242,204,0.08);
        border: 1px solid rgba(13,242,204,0.2);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        transition: transform 0.28s ease;
    }
    .auth-logo-mark:hover { transform: scale(1.06); }
    .auth-logo-mark img { width: 88px; height: 88px; object-fit: cover; }

    .auth-heading {
        font-size: 1.85rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.025em;
        line-height: 1.1;
    }
    .auth-sub { font-size: 0.85rem; color: #7FB5AC; margin-top: 0.15rem; }
    .auth-sub a { color: #0DF2CC; text-decoration: none; font-weight: 600; }
    .auth-sub a:hover { text-decoration: underline; }

    /* ── Aviso de privacidad ─────────────────────────────────── */
    .auth-notice {
        display: flex; align-items: flex-start; gap: 0.6rem;
        background: rgba(13,242,204,0.04);
        border: 1px solid rgba(13,242,204,0.12);
        border-radius: 0.85rem;
        padding: 0.7rem 0.9rem;
        font-size: 0.78rem; color: #7FB5AC; line-height: 1.5;
        margin-bottom: 1.5rem;
    }
    .auth-notice .material-icons-round { font-size: 15px; color: #0DF2CC; flex-shrink: 0; margin-top: 1px; }
    .auth-notice .info-tip {
        display: inline-flex; align-items: center; justify-content: center;
        width: 14px; height: 14px; border-radius: 50%;
        background: rgba(13,242,204,0.15); color: #0DF2CC;
        font-size: 9px; font-weight: 800; cursor: help;
        vertical-align: middle;
    }

    /* ── Campos del formulario ───────────────────────────────── */
    .form-field { margin-bottom: 1.25rem; }
    .form-label {
        display: block;
        font-size: 0.68rem;
        font-weight: 700;
        color: #7FB5AC;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        margin-bottom: 0.45rem;
    }
    .form-input {
        width: 100%;
        background: #152321;
        border: 1px solid #1E3330;
        border-radius: 0.85rem;
        padding: 0.85rem 1.1rem;
        color: #ffffff;
        font-size: 0.95rem;
        font-family: 'Outfit', sans-serif;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
        outline: none;
    }
    .form-input:focus {
        border-color: rgba(13,242,204,0.55);
        box-shadow: 0 0 0 4px rgba(13,242,204,0.09);
        transform: scale(1.008);
    }
    .form-input::placeholder { color: #6B9E96; }

    /* ── Link olvidé contraseña ──────────────────────────────── */
    .form-link-row {
        display: flex;
        justify-content: flex-end;
        margin-top: -0.55rem;
        margin-bottom: 1.35rem;
    }
    .form-link {
        font-size: 0.8rem; color: #7FB5AC; text-decoration: none;
        font-weight: 600; transition: color .15s;
    }
    .form-link:hover { color: #0DF2CC; }

    /* ── Botón principal ─────────────────────────────────────── */
    .btn-submit {
        width: 100%;
        background: #0DF2CC;
        color: #06231D;
        border: none;
        border-radius: 0.95rem;
        padding: 0 1.5rem;
        height: 58px;
        font-size: 1.08rem;
        font-weight: 800;
        font-family: 'Outfit', sans-serif;
        cursor: pointer;
        letter-spacing: 0.01em;
        position: relative;
        overflow: hidden;
        /* Micro-interacción: escala + sombra */
        transition: background 0.2s ease, transform 0.18s ease, box-shadow 0.25s ease;
    }
    .btn-submit:hover:not(:disabled) {
        background: #0CDFC0;
        transform: scale(1.04);
        box-shadow: 0 10px 30px rgba(13,242,204,0.50);
    }
    .btn-submit:active:not(:disabled) {
        transform: scale(0.97);
        box-shadow: 0 4px 16px rgba(13,242,204,0.3);
    }
    .btn-submit:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-submit.loading { color: transparent; }
    .btn-submit.loading::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        width: 22px; height: 22px;
        margin: -11px 0 0 -11px;
        border: 2.5px solid rgba(6,35,29,0.25);
        border-top-color: #06231D;
        border-radius: 50%;
        animation: spin .65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ─────────────────────────────────────────────── */
    .auth-footer {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid #1E3330;
        text-align: center;
        font-size: 0.85rem;
        color: #7FB5AC;
    }
    .auth-footer a { color: #0DF2CC; text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }

    /* ── Mensajes de respuesta ───────────────────────────────── */
    .mensaje, .auth-msg {
        margin-top: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 0.8rem;
        font-size: 0.84rem;
        font-weight: 600;
        display: none;
        line-height: 1.5;
        animation: fadeUp 0.25s ease forwards;
    }
    .mensaje.show, .auth-msg.show { display: block; }
    .mensaje.exito,  .auth-msg.exito  { background: rgba(74,222,128,0.1);  color: #4ade80; border: 1px solid rgba(74,222,128,0.22); }
    .mensaje.error,  .auth-msg.error  { background: rgba(239,68,68,0.1);   color: #f87171; border: 1px solid rgba(239,68,68,0.22); }
    .mensaje.info,   .auth-msg.info   { background: rgba(13,242,204,0.08); color: #0DF2CC; border: 1px solid rgba(13,242,204,0.18); }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 480px) {
        .auth-card { padding: 2rem 1.5rem 1.75rem; border-radius: 1.35rem; }
        .auth-logo-img { width: 120px; height: 120px; }
        .auth-heading { font-size: 1.6rem; }
        .btn-submit { height: 54px; font-size: 1rem; }
    }
    </style>
</head>
<body>
    <!-- Banner de privacidad -->
    <div class="privacy-bar">
        <span class="material-icons-round">lock</span>
        <span>Este servicio procesa datos de ubicación. Protegido bajo LFPDPPP.</span>
        <a href="#">Aviso de privacidad</a>
    </div>

    <div class="auth-card">
        <!-- Logo Centinela (logo.png con glow turquesa) -->
        <div class="auth-logo">
            <img
                class="auth-logo-img"
                src="logo.png"
                alt="Centinela"
                onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';"
            >
            <!-- Fallback: foto de la app si logo.png no carga -->
            <div class="auth-logo-mark" id="logo-fallback" style="display:none;">
                <img src="assets/im2.jpeg" alt="Centinela" onerror="this.style.display='none'">
            </div>
            <h1 class="auth-heading">Centinela</h1>
            <p class="auth-sub">Privada La Condesa · <a href="registro.html">Crear cuenta</a></p>
        </div>

        <!-- Aviso de ubicación -->
        <div class="auth-notice">
            <span class="material-icons-round">place</span>
            <span>
                Tu ubicación se registra al iniciar sesión para verificar accesos y detectar fraudes.
                <span class="info-tip" title="Se captura tu posición GPS en cada intento de login conforme a LFPDPPP.">i</span>
            </span>
        </div>

        <!-- Formulario -->
        <form id="loginForm" autocomplete="on">
            <div class="form-field">
                <label class="form-label" for="email">Correo electrónico</label>
                <input class="form-input" type="email" id="email" placeholder="nombre@ejemplo.com" required autocomplete="email"/>
            </div>

            <div class="form-field">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password"/>
            </div>

            <div class="form-link-row">
                <a href="recuperar-password.html" class="form-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-submit" id="btnLogin">
                Iniciar sesión
            </button>
        </form>

        <div id="mensaje" class="auth-msg"></div>

        <div class="auth-footer">
            ¿Sin cuenta? <a href="registro.html">Regístrate aquí</a>
        </div>
    </div>

    <script src="js/geo.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
